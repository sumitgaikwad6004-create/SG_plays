name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create missing Gradle wrapper
      run: |
        cd SG_plays
        gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x SG_plays/gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: SG_plays

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: SG_plays/app/build/outputs/apk/debug/app-debug.apk
