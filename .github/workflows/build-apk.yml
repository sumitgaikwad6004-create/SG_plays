name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Gradle Wrapper and Build
      run: |
        # Generate missing wrapper files in the root folder
        gradle wrapper
        
        # Grant permissions and compile
        chmod +x gradlew
        ./gradlew assembleDebug
        
        # Create output directory
        mkdir -p $GITHUB_WORKSPACE/output_apk/
        cp app/build/outputs/apk/debug/*.apk $GITHUB_WORKSPACE/output_apk/app-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: output_apk/app-debug.apk
